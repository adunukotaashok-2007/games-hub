<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Hub - 20 Mini Games</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div id="app">
    <header>
      <h1>🎮 Game Hub</h1>
      <p>20 Mini Games • Bot • Local Multiplayer • Online</p>
    </header>

    <main>
      <section id="home" class="screen">
        <h2>Choose a Game</h2>

        <div class="mode-buttons">
          <button onclick="setMode('bot')">🤖 Play vs Bot</button>
          <button onclick="setMode('local')">👥 2 Players</button>
          <button onclick="setMode('single')">🧑 Single Player</button>
          <button onclick="setMode('online')">🌐 Online</button>
        </div>

        <p id="modeText">Mode: Play vs Bot</p>

        <div id="games" class="game-grid"></div>
      </section>

      <section id="gameScreen" class="screen hidden">
        <button class="back" onclick="goHome()">← Back</button>
        <h2 id="gameTitle"></h2>
        <p id="gameInfo"></p>
        <div id="game"></div>
      </section>
    </main>

    <footer>
      <p>Game Hub © 2026</p>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
